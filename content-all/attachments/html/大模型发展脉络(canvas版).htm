<!DOCTYPE html>

<style>

  .tb-btn.track-language.active { background: rgba(83,74,183,0.2); color: #a097f7; border-color: #534AB7; }
  .tb-btn.track-core.active { background: rgba(186,117,23,0.2); color: #f0b84a; border-color: #BA7517; }

<body>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
// Time axis: year → Y pixel (in world coords, canvas height ~1800)
// We define years from 1980 to 2025, Y range 80 to 1680
// Piecewise non-linear year → Y mapping.
// Segments: each entry = [yearStart, yearEnd, yStart, yEnd]
// Early history is compressed; post-2017 dense era is stretched.
const Y_SEGMENTS = [
  [1978, 2006, 60,  200],   // 28 yrs → 140px  (萌芽期，超压缩)
  [2006, 2013, 200, 360],   // 7 yrs  → 160px  (深度学习爆发前)
  [2013, 2017, 360, 530],   // 4 yrs  → 170px
  [2017, 2018, 530, 650],   // 1 yr   → 120px  (Transformer)
  [2018, 2019, 650, 800],   // 1 yr   → 150px
  [2019, 2020, 800, 940],   // 1 yr   → 140px
  [2020, 2021, 940, 1090],  // 1 yr   → 150px
  [2021, 2022, 1090,1250],  // 1 yr   → 160px
  [2022, 2023, 1250,1420],  // 1 yr   → 170px
  [2023, 2024, 1420,1610],  // 1 yr   → 190px
  [2024, 2026, 1610,1860],  // 2 yrs  → 250px  (最近最密集)
];
function yearToY(year) {
  for (const [y0, y1, py0, py1] of Y_SEGMENTS) {
    if (year >= y0 && year <= y1) {
      return py0 + (year - y0) / (y1 - y0) * (py1 - py0);
    }
  }
  // fallback clamp
  return year < Y_SEGMENTS[0][0] ? Y_SEGMENTS[0][2] : Y_SEGMENTS[Y_SEGMENTS.length-1][3];
}

const TRACK_STYLE = {
  vision:   { color: '#1D9E75', fill: 'rgba(29,158,117,0.18)',   label: '视觉线' },

  core:     { color: '#BA7517', fill: 'rgba(186,117,23,0.22)',   label: '融合核心' },
  open:     { color: '#185FA5', fill: 'rgba(24,95,165,0.18)',    label: '开源' },
  multi:    { color: '#993C1D', fill: 'rgba(153,60,29,0.18)',    label: '多模态' },

// Column X positions
const COL = { vision: 160, core: 480, open: 750, language: 1020 };

const NODES = [

  },
  {
    id:'gpt4', year:2023.5, col:'core', track:'core',
    name:'2023 GPT-4',

  },
  {

    desc:'引入测试时计算扩展(test-time compute)。通过强化学习训练长思维链，使模型能在回答前进行深度推理。'

// Compute world X,Y for each node
NODES.forEach(n => {
  n.wx = COL[n.col];
  n.wy = yearToY(n.year);
});

const EDGES = [
  {from:'neuro',    to:'lenet',       dashed:false},
  {from:'lenet',    to:'alexnet',     dashed:false},
  {from:'alexnet',  to:'gan',         dashed:false},
  {from:'word2vec', to:'seq2seq',     dashed:false},
  {from:'seq2seq',  to:'transformer', dashed:false},
  {from:'alexnet',  to:'transformer', dashed:true},
  {from:'transformer',to:'bert',      dashed:false},
  {from:'transformer',to:'gpt1',      dashed:false},
  {from:'gpt1',     to:'gpt2',        dashed:false},
  {from:'gpt2',     to:'gpt3',        dashed:false},
  {from:'bert',     to:'gpt3',        dashed:true},
  {from:'gpt3',     to:'clip',        dashed:false},
  {from:'alexnet',  to:'clip',        dashed:true},
  {from:'clip',     to:'instructgpt', dashed:false},
  {from:'gpt3',     to:'instructgpt', dashed:false},
  {from:'instructgpt',to:'llama',     dashed:true},
  {from:'instructgpt',to:'gpt4',      dashed:false},
  {from:'clip',     to:'gpt4',        dashed:true},
  {from:'gpt4',     to:'gpt4o',       dashed:false},
  {from:'gpt4',     to:'o1',          dashed:false},
  {from:'llama',    to:'deepseekv3',  dashed:false},
  {from:'deepseekv3',to:'deepseekr1', dashed:false},
  {from:'o1',       to:'deepseekr1',  dashed:true},
];

// ─── CANVAS SETUP ────────────────────────────────────────────────────────────
const canvasWrap = document.getElementById('canvas-wrap');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let dpr = window.devicePixelRatio || 1;
let cw, ch; // CSS pixels
let scale = 1, tx = 0, ty = 0;
let dragging = false, dragMoved = false;
let lastX = 0, lastY = 0;
let activeTrack = 'all';
let hoveredNode = null, selectedNode = null;
const NODE_W = 170, NODE_H = 54;

function resize() {
  dpr = window.devicePixelRatio || 1;
  cw = canvasWrap.clientWidth;
  ch = canvasWrap.clientHeight;
  canvas.width = cw * dpr;
  canvas.height = ch * dpr;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // Initial fit: show full timeline
  fitAll();
  render();
}

function fitAll() {
  const allX = NODES.map(n => n.wx);
  const allY = NODES.map(n => n.wy);
  const minX = Math.min(...allX) - NODE_W/2 - 60;
  const maxX = Math.max(...allX) + NODE_W/2 + 80;
  const minY = Math.min(...allY) - 60;
  const maxY = Math.max(...allY) + 60;
  const ww = maxX - minX, wh = maxY - minY;
  const scaleX = cw / ww, scaleY = ch / wh;
  scale = Math.min(scaleX, scaleY) * 0.92;
  tx = (cw - ww * scale) / 2 - minX * scale;
  ty = (ch - wh * scale) / 2 - minY * scale;
}

function w2s(wx, wy) {
  return [wx * scale + tx, wy * scale + ty];
}
function s2w(sx, sy) {
  return [(sx - tx) / scale, (sy - ty) / scale];
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function isVisible(node) {
  if (activeTrack === 'all') return true;
  if (activeTrack === 'core' && (node.track === 'core' || node.track === 'multi')) return true;
  return activeTrack === node.track;
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function drawRR(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r);
  ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h);
  ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r);
  ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

function renderAll() {
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cw, ch);

  // Background subtle grid
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < cw; i += 60) {
    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,ch); ctx.stroke();
  }
  ctx.restore();

  // Year axis labels + horizontal lines
  drawYearAxis();

  // Column headers
  drawColumnHeaders();

  // Track lane backgrounds
  drawLaneBg();

  // Edges
  EDGES.forEach(drawEdge);

  // Nodes
  NODES.forEach(n => drawNode(n));

  ctx.restore();
}

function drawYearAxis() {
  const years = [1980, 1998, 2006, 2012, 2013, 2014, 2015, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025];
  const labelYears = [1980, 1998, 2006, 2012, 2013, 2015, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025];

  years.forEach(yr => {
    const wy = yearToY(yr);
    const [, sy] = w2s(0, wy);
    if (sy < -10 || sy > ch + 10) return;

    const isLabel = labelYears.includes(yr);
    ctx.save();
    ctx.strokeStyle = isLabel ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.03)';
    ctx.lineWidth = isLabel ? 0.5 : 0.3;
    ctx.setLineDash(isLabel ? [4,8] : []);
    ctx.beginPath();
    ctx.moveTo(0, sy);
    ctx.lineTo(cw, sy);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    if (isLabel) {
      const [lx] = w2s(0, wy);
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.font = `${Math.max(9, 10 * scale)}px -apple-system, "PingFang SC", sans-serif`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(yr + '', 6, sy);
      ctx.restore();
    }
  });
}

function drawColumnHeaders() {
  const headers = [
    { col:'vision',   label:'视觉线 Vision',    sub:'感知→理解→生成' },
    { col:'core',     label:'核心融合线',        sub:'Transformer & GPT系列' },
    { col:'open',     label:'开源 / 推理强化',   sub:'LLaMA / DeepSeek' },
    { col:'language', label:'语言线 Language',   sub:'表示→理解→对齐' },
  ];
  headers.forEach(h => {
    const wx = COL[h.col];
    const wy = yearToY(1978.3);
    const [sx, sy] = w2s(wx, wy);
    if (sx < -100 || sx > cw + 100) return;
    const ts = TRACK_STYLE[h.col === 'open' ? 'open' : h.col === 'core' ? 'core' : h.col];
    ctx.save();
    ctx.fillStyle = ts ? ts.color : '#fff';
    ctx.font = `600 ${Math.max(10, 13 * scale)}px -apple-system,"PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(h.label, sx, sy);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = `${Math.max(8, 10 * scale)}px -apple-system,"PingFang SC",sans-serif`;
    ctx.fillText(h.sub, sx, sy + Math.max(10, 14 * scale));
    ctx.restore();
  });
}

function drawLaneBg() {
  const cols = ['vision','core','open','language'];
  cols.forEach(col => {
    const wx = COL[col];
    const track = col === 'open' ? 'open' : col;
    const ts = TRACK_STYLE[track];
    if (!ts) return;
    const half = NODE_W / 2 + 20;
    const [sx] = w2s(wx - half, 0);
    const sw = (NODE_W + 40) * scale;
    ctx.save();
    ctx.fillStyle = hexToRgba(ts.color, 0.04);
    ctx.fillRect(sx, 0, sw, ch);
    ctx.restore();
  });
}

function drawEdge(e) {
  const a = NODES.find(n => n.id === e.from);
  const b = NODES.find(n => n.id === e.to);
  if (!a || !b) return;

  const visA = isVisible(a), visB = isVisible(b);
  const op = (visA || visB) ? (activeTrack === 'all' ? 0.55 : 0.7) : 0.08;

  const [ax, ay] = w2s(a.wx, a.wy);
  const [bx, by] = w2s(b.wx, b.wy);

  const ts = TRACK_STYLE[a.track];
  const color = ts ? ts.color : '#888';

  ctx.save();
  ctx.globalAlpha = op;
  ctx.strokeStyle = color;
  ctx.lineWidth = e.dashed ? 0.8 * scale : 1.2 * scale;
  if (e.dashed) ctx.setLineDash([4 * scale, 5 * scale]);

  // Curved path
  const dx = bx - ax, dy = by - ay;
  const cx1 = ax + dx * 0.1;
  const cy1 = ay + dy * 0.5;
  const cx2 = bx - dx * 0.1;
  const cy2 = by - dy * 0.5;

  ctx.beginPath();
  ctx.moveTo(ax, ay + NODE_H/2 * scale);
  ctx.bezierCurveTo(cx1, cy1, cx2, cy2, bx, by - NODE_H/2 * scale);
  ctx.stroke();

  // Arrowhead
  ctx.setLineDash([]);
  ctx.globalAlpha = op;
  const endX = bx, endY = by - NODE_H/2 * scale;
  const angle = Math.atan2(endY - cy2, endX - cx2);
  const arrLen = 7 * scale;
  ctx.beginPath();
  ctx.moveTo(endX, endY);
  ctx.lineTo(endX - arrLen * Math.cos(angle - 0.4), endY - arrLen * Math.sin(angle - 0.4));
  ctx.moveTo(endX, endY);
  ctx.lineTo(endX - arrLen * Math.cos(angle + 0.4), endY - arrLen * Math.sin(angle + 0.4));
  ctx.lineWidth = 1 * scale;
  ctx.stroke();

  ctx.restore();
}

function drawNode(node) {
  const [sx, sy] = w2s(node.wx, node.wy);
  const hw = NODE_W / 2 * scale;
  const hh = NODE_H / 2 * scale;
  if (sx + hw < 0 || sx - hw > cw || sy + hh < 0 || sy - hh > ch) return;

  const ts = TRACK_STYLE[node.track];
  const color = ts ? ts.color : '#888';
  const fill = ts ? ts.fill : 'rgba(128,128,128,0.15)';
  const vis = isVisible(node);
  const hover = node === hoveredNode;
  const sel = node === selectedNode;

  ctx.save();
  ctx.globalAlpha = vis ? 1 : 0.15;

  const x = sx - hw, y = sy - hh;
  const w = NODE_W * scale, h = NODE_H * scale;
  const r = 8 * scale;

  // Shadow / glow for selected
  if (sel) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 16;
  } else if (hover) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
  }

  // Fill
  drawRR(x, y, w, h, r);
  ctx.fillStyle = hover || sel ? hexToRgba(ts?.color || '#888', 0.28) : fill;
  ctx.fill();

  // Border
  ctx.strokeStyle = color;
  ctx.lineWidth = sel ? 1.5 * scale : hover ? 1 * scale : 0.7 * scale;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Year badge (small top-left)
  const yearStr = String(Math.floor(node.year));
  const fs = Math.max(8, 9 * scale);
  ctx.font = `500 ${fs}px -apple-system,"PingFang SC",sans-serif`;
  ctx.fillStyle = hexToRgba(color, 0.7);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(yearStr, x + 8 * scale, y + 6 * scale);

  // Main label
  const lineFs = Math.max(9, 11 * scale);
  ctx.font = `600 ${lineFs}px -apple-system,"PingFang SC",sans-serif`;
  ctx.fillStyle = '#e8e6df';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Strip year prefix from name for display
  const displayName = node.name.replace(/^\d{4}(-\d{2,4})?\s+/, '').replace(/\s+/g,' ');
  ctx.fillText(displayName, sx, sy + 4 * scale);

  ctx.restore();
}

// ─── INTERACTION ─────────────────────────────────────────────────────────────
function getHit(ex, ey) {
  const [wx, wy] = s2w(ex, ey);
  return NODES.find(n => {
    const dx = Math.abs(n.wx - wx);
    const dy = Math.abs(n.wy - wy);
    return dx < NODE_W / 2 + 4 && dy < NODE_H / 2 + 4;
  });
}

function getCanvasXY(e) {
  const rect = canvas.getBoundingClientRect();
  return [e.clientX - rect.left, e.clientY - rect.top];
}

canvas.addEventListener('mousedown', e => {
  const [mx, my] = getCanvasXY(e);
  dragging = true; dragMoved = false;
  lastX = mx; lastY = my;
  canvasWrap.classList.add('grabbing');
});

canvas.addEventListener('mousemove', e => {
  const [mx, my] = getCanvasXY(e);
  if (dragging) {
    const dx = mx - lastX, dy = my - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true;
    tx += dx; ty += dy;
    lastX = mx; lastY = my;
    render(); return;
  }
  const hit = getHit(mx, my);
  if (hit !== hoveredNode) {
    hoveredNode = hit;
    canvas.style.cursor = hit ? 'pointer' : 'grab';
    render();
  }
});

canvas.addEventListener('mouseup', e => {
  canvasWrap.classList.remove('grabbing');
  if (!dragMoved) {
    const [mx, my] = getCanvasXY(e);
    const hit = getHit(mx, my);
    if (hit) { selectedNode = hit; showDetail(hit); render(); }
  }
  dragging = false;
});

canvas.addEventListener('mouseleave', () => {
  dragging = false;
  canvasWrap.classList.remove('grabbing');
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const [mx, my] = getCanvasXY(e);
  const factor = e.deltaY < 0 ? 1.1 : 0.91;
  const ns = Math.max(0.3, Math.min(5, scale * factor));
  tx = mx - (mx - tx) * (ns / scale);
  ty = my - (my - ty) * (ns / scale);
  scale = ns;
  render();
}, { passive: false });

// Touch
let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true; dragMoved = false;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const factor = dist / lastTouchDist;
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const rect = canvas.getBoundingClientRect();
    const mx = cx - rect.left, my = cy - rect.top;
    const ns = Math.max(0.3, Math.min(5, scale * factor));
    tx = mx - (mx - tx) * (ns / scale);
    ty = my - (my - ty) * (ns / scale);
    scale = ns; lastTouchDist = dist;
    render();
  } else if (e.touches.length === 1 && dragging) {
    const dx = e.touches[0].clientX - lastX;
    const dy = e.touches[0].clientY - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true;
    tx += dx; ty += dy;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    render();
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (e.touches.length === 0 && !dragMoved && e.changedTouches.length === 1) {
    const t = e.changedTouches[0];
    const rect = canvas.getBoundingClientRect();
    const hit = getHit(t.clientX - rect.left, t.clientY - rect.top);
    if (hit) { selectedNode = hit; showDetail(hit); render(); }
  }
  dragging = false;
});

// Toolbar
document.querySelectorAll('[data-track]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-track]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTrack = btn.dataset.track;
    render();
  });
});
document.getElementById('zi').onclick = () => { scale = Math.min(5, scale * 1.2); render(); };
document.getElementById('zo').onclick = () => { scale = Math.max(0.3, scale / 1.2); render(); };
document.getElementById('zr').onclick = () => { fitAll(); render(); };

// Detail panel
function showDetail(node) {
  const ts = TRACK_STYLE[node.track];
  const color = ts ? ts.color : '#888';
  document.getElementById('dc').innerHTML = `
    <h3>${node.name}</h3>
    <div class="dp-meta">
      <span class="dp-badge" style="background:${hexToRgba(color,0.2)};color:${color};border:1px solid ${hexToRgba(color,0.4)}">${ts?.label||node.track}</span>
      <span style="font-size:11px;color:#555">${Math.floor(node.year)} 年</span>
    </div>
    <div class="dp-section">借鉴来源</div>
    <div class="dp-val">${node.borrow}</div>
    <div class="dp-section">核心贡献</div>
    <div class="dp-val">${node.contrib}</div>
    <div class="dp-section">详解</div>
    <div class="dp-val">${node.desc}</div>
  `;
  document.getElementById('detail').style.display = 'block';
}
document.getElementById('dpc').onclick = () => {
  document.getElementById('detail').style.display = 'none';
  selectedNode = null; render();
};

function hexToRgba(hex, a) {
  if (!hex || hex[0] !== '#') return `rgba(128,128,128,${a})`;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// RAF-based render
let rafPending = false;
function render() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; renderAll(); });
}

window.addEventListener('resize', resize);
resize();
</script>
