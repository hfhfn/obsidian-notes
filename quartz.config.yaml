# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: HFH 的笔记
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  baseUrl: notes.hfhfn.dpdns.org
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .claudian
    - .claude
    - 00_附件/HTML源码
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#fdfdfb"
        lightgray: "#e8e6e1"
        gray: "#a3a19b"
        darkgray: "#3c3c39"
        dark: "#1b1b19"
        secondary: "#1f5f8b"
        tertiary: "#0d7d74"
        highlight: "rgba(31, 95, 139, 0.08)"
        textHighlight: "rgba(255, 213, 79, 0.42)"
      darkMode:
        light: "#14151a"
        lightgray: "#2a2c34"
        gray: "#6b6f7a"
        darkgray: "#c6c9d1"
        dark: "#f1f2f5"
        secondary: "#6aa9d8"
        tertiary: "#4fc3b8"
        highlight: "rgba(106, 169, 216, 0.12)"
        textHighlight: "rgba(255, 213, 79, 0.28)"
  links:
    markdownLinkResolution: shortest
  contentIndex:
    enableSiteMap: true
    enableRSS: true
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseBlockReferences: true
      enableYouTubeEmbed: true
      enableVideoEmbed: true
    order: 40
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "./quartz/plugins-local/nx-personal"
    enabled: true
  - source: "./quartz/plugins-local/nx-actions"
    enabled: true
  - source: "./quartz/plugins-local/nx-tabs"
    enabled: true
  - source: "./quartz/plugins-local/nx-subscribe"
    enabled: true
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      # Fonts are committed under quartz/static/fonts/ and served from the
      # site itself: no network access at build time, no request to
      # fonts.googleapis.com at page load (slow/blocked in CN).
      # "selfHosted" would re-download from Google on every build and fails
      # when that request is flaky in CI.
      fontOrigin: local
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      # 面板标题
      title: "探索"
      # 点击目录名 = 跳转到目录页（那里有 MOC 导航卡片）；
      # 点击左侧小箭头 = 展开/收起子项。
      #
      # 不能用 "collapse"：那样点击只展开、永远进不到目录页，
      # 用户就看不到目录页的 MOC 导航（反馈「目录点击显示 MOC 没成功」）。
      # 用 "link" 后两种操作都保留，互不冲突。
      folderClickBehavior: "link"
      # 默认展开第一层，省一次点击
      folderDefaultState: "open"
      # 归档放最后；其余保持「文件夹在前、同级按名称」的默认顺序
      # 置底顺序：应用&工具笔记 在最底，归档次之，其余按名称
      # 过滤掉不属于笔记分类的节点：
      # - tags：320 个标签，展开会把目录树挤爆（由 nx-tag-link 单独渲染）
      # - 三个卡片库：它们是站点展示层页面，由 nx-lib-links 在面板外渲染，
      #   放进 explorer 就会落在「探索」的折叠范围内
      filterFn: '(node) => !["tags", "藏书馆", "观影库", "视频与专题"].includes(node.slugSegment)'
      # 排序：常规目录在前（按名称），三个卡片库排最后，标签索引排最末
      sortFn: '(a, b) => { const rank = (n) => { const s = n.slugSegment; if (s === "tags") return 90; if (s === "藏书馆" || s === "观影库" || s === "视频与专题") return 50; if (s === "应用&工具笔记" || s === "应用-and-工具笔记") return 20; if (s === "归档") return 10; return 0; }; const ra = rank(a), rb = rank(b); if (ra !== rb) return ra - rb; if ((!a.isFolder && !b.isFolder) || (a.isFolder && b.isFolder)) return (a.displayName || "").localeCompare(b.displayName || "", undefined, { numeric: true, sensitivity: "base" }); return a.isFolder ? -1 : 1; }'
    layout:
      position: left
      priority: 50
  - source: "./quartz/plugins-local/nx-lib-links"
    enabled: true
    layout:
      position: left
      # 紧跟 explorer(50) 之后：三个卡片库在「探索」折叠范围之外
      priority: 51
  - source: "./quartz/plugins-local/nx-tag-link"
    enabled: true
    layout:
      position: left
      # 排在三个库之后
      priority: 52
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  # 评论改用自建（nx-comments），不再用 giscus。
  # giscus 只能用 GitHub 账号登录，与站点自己的登录（邮箱/Google/GitHub）不统一。
  - source: "@quartz-community/comments"
    enabled: false
  - source: "./quartz/plugins-local/nx-comments"
    enabled: true
    layout:
      position: afterBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      # 站点来源说明放在页尾
      message: "本站内容来自我的 Obsidian 笔记库，由 Quartz 自动构建发布。"
      links:
        # Google OAuth 发布要求：首页必须有指向隐私政策的链接，
        # 且该链接必须与 Cloud Console 里填写的一致。
        隐私政策: /privacy
        服务条款: /terms
        GitHub: https://github.com/hfhfn
        RSS: /index.xml
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
      condition: not-index
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
