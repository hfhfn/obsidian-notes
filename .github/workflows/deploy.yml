name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 构建脚本依赖 Pillow（图片转 WebP）和 PyYAML（读 frontmatter），
      # ubuntu-latest + setup-python 默认不含这两个包。
      # 缺了会在 make_public_subset.py / build_library.py 的 import 处
      # ModuleNotFoundError 退出码 1，表现为「Build public site 失败」。
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — build only, skipping deploy."
          fi

      # ---------- 公开站：只含白名单目录 ----------
      # 失败时把完整日志上传为 artifact，便于本地下载排查。
      # GitHub 网页上的失败日志默认折叠，::error:: 注解也常被吞掉。
      - name: Build public site
        id: build_public
        continue-on-error: true
        run: |
          set -o pipefail
          # 构建前诊断：三库 JSON 的 cover_local 与封面文件是否到位。
          # 之前出现过「CI 产物封面全丢但构建成功」的问题，加这段定位。
          python - <<'DIAG'
          import json, pathlib
          for f in ["藏书馆/_books.json", "观影库/_movies.json", "视频与专题/_videos.json"]:
              p = pathlib.Path("content-all") / f
              if p.exists():
                  d = json.loads(p.read_text(encoding="utf-8"))
                  n = sum(1 for x in d if x.get("cover_local"))
                  print(f"[diag] content-all/{f}: {n}/{len(d)} 有 cover_local")
              else:
                  print(f"[diag] content-all/{f}: 缺失")
          covers = list(pathlib.Path("content-all/attachments/covers").rglob("*"))
          print(f"[diag] covers 文件: {sum(1 for c in covers if c.is_file())} 个")
          DIAG
          npm run build:public 2>&1 | tee build-public.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          # 构建后诊断：产物里到底有没有封面
          python - <<'DIAG2'
          import re, pathlib
          p = pathlib.Path("dist-public/视频与专题/index.html")
          if p.exists():
              t = p.read_text(encoding="utf-8", errors="ignore")
              img = len(re.findall(r'<img[^>]*class="[^"]*book-cover[^"]*"', t))
              empty = t.count("book-cover-empty")
              print(f"[diag] 产物 视频页: img={img} empty={empty}")
          DIAG2
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-public.log
            build-all.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Fail if build failed
        if: steps.build_public.outputs.exit_code != '0'
        run: |
          echo "::error::build:public 退出码 ${{ steps.build_public.outputs.exit_code }}"
          echo "===== 最后 40 行 ====="
          tail -40 build-public.log
          exit 1

      - name: Deploy public site
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-public --project-name=hfhfn-notes --branch=main --commit-dirty=true

      # ---------- 私有站：完整内容，由 Cloudflare Access 保护 ----------
      - name: Point config at private domain
        run: |
          sed -i 's|baseUrl: .*|baseUrl: private.hfhfn.dpdns.org|' quartz.config.yaml
          grep baseUrl quartz.config.yaml

      - name: Build private site
        run: npm run build
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}

      - name: Deploy private site
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-all --project-name=hfhfn-notes-private --branch=main
